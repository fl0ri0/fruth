<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Read Check</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f9f9f9;
        }
        table {
            border-collapse: collapse;
            width: 250px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            background-color: white;
        }
        th, td {
            padding: 12px;
            text-align: center;
            border: 1px solid #ddd;
        }
        th {
            background-color: #f4f4f4;
            font-weight: bold;
        }
        tr.total-row {
            font-weight: bold;
            background-color: #eee;
        }
    </style>
</head>
<body>

<table>
    <thead>
        <tr>
            <th>Value</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td>42</td>
        </tr>
        <tr>
            <td>96</td>
        </tr>
    </tbody>
    <tfoot>
        <tr class="total-row">
            <td>Sum: 138</td>
        </tr>
    </tfoot>
</table>

</body>
</html>
