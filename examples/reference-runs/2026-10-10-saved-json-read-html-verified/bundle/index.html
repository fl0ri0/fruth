<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Sum Check</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f7f6;
        }
        table {
            border-collapse: collapse;
            width: 300px;
            background-color: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #eee;
        }
        th {
            background-color: #4CAF50;
            color: white;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9rem;
        }
        tr:last-child td {
            border-bottom: none;
        }
        .sum-row {
            background-color: #f9f9f9;
            font-weight: bold;
            color: #333;
        }
        .value-cell {
            color: #555;
        }
    </style>
</head>
<body>

    <table>
        <thead>
            <tr>
                <th>Value List</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td class="value-cell">42</td>
            </tr>
            <tr>
                <td class="value-cell">96</td>
            </tr>
        </tbody>
        <tfoot>
            <tr class="sum-row">
                <td>Sum: 138</td>
            </tr>
        </tfoot>
    </table>

</body>
</html>
